name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK and native tools
        shell: pwsh
        run: ./tools/bootstrap.ps1 -AcceptSdkLicense
      - name: Build APK, lint, and Java verification
        shell: pwsh
        run: ./tools/build-android.ps1
      - name: Native parser, protocol, and privacy tests
        shell: pwsh
        run: ./tools/verify-native-core.ps1
      - name: Bounded fuzz and reachable vulnerability scan
        shell: pwsh
        run: ./tools/verify-security.ps1 -Fuzz
