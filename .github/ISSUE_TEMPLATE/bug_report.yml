name: Bug report / 问题报告
description: Report a reproducible problem without exposing credentials.
body:
  - type: input
    id: version
    attributes:
      label: App and Mihomo versions / 应用和内核版本
      description: Copy the versions from About. Do not paste a subscription link.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device model / 系统版本和机型
      description: Do not include device identifiers, phone numbers or account details.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior / 操作步骤和预期
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Redacted diagnostic report / 脱敏诊断报告
      description: Preview the report first. Remove subscription URLs, IPs, SNI, UUIDs, passwords, API keys and personal information. Do not upload raw configurations or terminal history.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed credentials and personal information from this report and any attachments.
          required: true
